[project]
name = "campuspath-seed"
version = "1.0.0"
description = "CampusPath Synthetic Campus Sandbox 数据生成器（WP2）"
requires-python = ">=3.12"
dependencies = [
    "campuspath-contracts",
]

# Seed 产出的每条记录都是契约层的模型实例：跑一次生成器就等于跑一次全量契约校验。
# 同样禁止依赖模型 SDK——数据生成里不该有任何模型调用。

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campuspath_seed"]

[tool.uv.sources]
campuspath-contracts = { path = "../contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
