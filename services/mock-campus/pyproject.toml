[project]
name = "campuspath-mock-campus"
version = "1.0.0"
description = "Mock Campus REST —— 合成校园系统，接口与真实适配器同形（WP4）"
requires-python = ">=3.12"
dependencies = [
    "campuspath-contracts",
    "campuspath-connector",
    "campuspath-seed",
    "fastapi>=0.115",
]

# 🚫 不得依赖模型 SDK：本服务只搬运 Seed 数据，不做任何判定。

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campuspath_mock_campus"]

[tool.uv.sources]
campuspath-contracts = { path = "../../contracts", editable = true }
campuspath-connector = { path = "../connector", editable = true }
campuspath-seed = { path = "../../seed", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
