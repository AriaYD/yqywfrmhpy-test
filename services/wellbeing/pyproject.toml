[project]
name = "campuspath-wellbeing"
version = "1.0.0"
description = "Wellbeing Reminder Composer —— 固定模板与两次提醒状态机，零 LLM（WP5）"
requires-python = ">=3.12"
dependencies = ["campuspath-contracts"]

# 🚫 永远不得依赖模型 SDK。这条链路上唯一允许的 LLM 是 A5 生成 Low-load 计划，
# 而那发生在别的进程里（Spec §8.9.4）。

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campuspath_wellbeing"]

[tool.uv.sources]
campuspath-contracts = { path = "../../contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
