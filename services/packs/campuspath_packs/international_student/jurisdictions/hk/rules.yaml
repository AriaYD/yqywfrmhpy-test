{
  "rules": [
    {"rule_id":"HK-STUDY-EMPLOYMENT-001","version":"0.1.0","status":"review_required","jurisdiction":"HK-SAR","institution":null,"topic":"employment_during_study","summary":"A student pathway may require confirmation of the conditions attached to the current study permission before employment begins.","conditions":[{"field":"goal_type","operator":"in","value":["part_time_work","internship"]},{"field":"permission_category","operator":"exists","value":true}],"decision_effect":"needs_confirmation","constraints":["Check the current permission endorsement and any work conditions.","Do not infer authorization from student status alone."],"required_evidence":["permission_category","permission_expiry_date","current_permission_or_endorsement"],"preparation_action_ids":["PREP-HK-WORK-001"],"support_item_ids":[],"source_ids":["HK-IMMD-STUDY","HK-IMMD-FAQ-STUDY"],"effective_from":null,"effective_until":null,"last_verified_at":"2026-08-01","review_at":"2026-09-01","uncertainty_policy":"needs_confirmation","reviewer":"Policy reviewer required"},
    {"rule_id":"HK-STUDY-INTERNSHIP-001","version":"0.1.0","status":"review_required","jurisdiction":"HK-SAR","institution":null,"topic":"internship","summary":"An internship requires checking both immigration conditions and any institution approval or programme-specific conditions.","conditions":[{"field":"goal_type","operator":"equals","value":"internship"}],"decision_effect":"needs_confirmation","constraints":["Confirm work location, duration, hours, and school approval before acceptance."],"required_evidence":["intended_start_date","opportunity_location","opportunity_hours","school_approval"],"preparation_action_ids":["PREP-HK-WORK-001","PREP-HK-SCHOOL-001"],"support_item_ids":[],"source_ids":["HK-IMMD-FAQ-STUDY","HK-LABOUR-INTERNS"],"effective_from":null,"effective_until":null,"last_verified_at":"2026-08-01","review_at":"2026-09-01","uncertainty_policy":"needs_confirmation","reviewer":"Policy reviewer required"},
    {"rule_id":"HK-GRAD-IANG-001","version":"0.1.0","status":"review_required","jurisdiction":"HK-SAR","institution":null,"topic":"graduate_employment","summary":"A non-local graduate may explore the IANG route, subject to the official route conditions and application timing.","conditions":[{"field":"goal_type","operator":"equals","value":"graduate_employment"}],"decision_effect":"future_eligible","constraints":["Confirm graduation status, timing, and current IANG requirements with Immigration Department."],"required_evidence":["actual_graduation_date","permission_expiry_date","offer_or_employment_plan"],"preparation_action_ids":["PREP-HK-GRAD-001"],"support_item_ids":[],"source_ids":["HK-IMMD-IANG","HK-IMMD-IANG-FAQ"],"effective_from":null,"effective_until":null,"last_verified_at":"2026-08-01","review_at":"2026-09-01","uncertainty_policy":"needs_confirmation","reviewer":"Policy reviewer required"},
    {"rule_id":"HK-WORK-LOCATION-001","version":"0.1.0","status":"draft","jurisdiction":"HK-SAR","institution":null,"topic":"employment_during_study","summary":"Work location and activity details must be checked against the permission conditions; this pack does not generalize one approval to every employer or location.","conditions":[{"field":"goal_type","operator":"in","value":["part_time_work","internship"]}],"decision_effect":"needs_confirmation","constraints":["Opportunity location and activity type are required."],"required_evidence":["opportunity_location","opportunity_type"],"preparation_action_ids":["PREP-BASE-JOB-001"],"support_item_ids":[],"source_ids":["HK-IMMD-FAQ-STUDY"],"effective_from":null,"effective_until":null,"last_verified_at":"2026-08-01","review_at":"2026-09-01","uncertainty_policy":"needs_confirmation","reviewer":"Policy reviewer required"}
  ]
