{
  "rules": [
    {"rule_id":"CN-STUDENT-WORKSTUDY-001","version":"0.1.0","status":"review_required","jurisdiction":"CN-MAINLAND","institution":null,"topic":"employment_during_study","summary":"International-student work-study activity must be checked against national rules and the host institution/local implementation before it begins.","conditions":[{"field":"goal_type","operator":"in","value":["part_time_work","internship"]}],"decision_effect":"needs_confirmation","constraints":["National context does not establish permission for a particular city, employer, schedule, or activity."],"required_evidence":["permission_category","permission_expiry_date","institution_approval","opportunity_location","opportunity_hours"],"preparation_action_ids":["PREP-CN-WORK-001"],"support_item_ids":[],"source_ids":["CN-MOE-WORKSTUDY","CN-MOE-ADMISSION"],"effective_from":null,"effective_until":null,"last_verified_at":"2026-08-01","review_at":"2026-09-01","uncertainty_policy":"needs_confirmation","reviewer":"Policy reviewer required"},
    {"rule_id":"CN-GRAD-EMPLOYMENT-001","version":"0.1.0","status":"review_required","jurisdiction":"CN-MAINLAND","institution":null,"topic":"graduate_employment","summary":"Graduate employment requires checking the foreigner employment framework, work-permit route, and local implementation for the intended work location.","conditions":[{"field":"goal_type","operator":"equals","value":"graduate_employment"}],"decision_effect":"future_eligible","constraints":["City/province and occupation requirements are not supplied by this national overlay."],"required_evidence":["actual_graduation_date","offer_or_employment_plan","opportunity_location","employer_sponsorship"],"preparation_action_ids":["PREP-CN-GRAD-001"],"support_item_ids":[],"source_ids":["CN-SC-FOREIGN-EMPLOYMENT","CN-MOHRSS-GRADUATES","CN-NIA-GUIDE"],"effective_from":null,"effective_until":null,"last_verified_at":"2026-08-01","review_at":"2026-09-01","uncertainty_policy":"needs_confirmation","reviewer":"Policy reviewer required"},
    {"rule_id":"CN-CITY-SCOPE-001","version":"0.1.0","status":"review_required","jurisdiction":"CN-MAINLAND","institution":null,"topic":"jurisdiction_scope","summary":"A mainland national Pack does not decide city or province-specific eligibility without a matching local confirmation or overlay.","conditions":[{"field":"intended_work_jurisdiction","operator":"equals","value":"CN-MAINLAND"},{"field":"local_overlay_confirmed","operator":"equals","value":false}],"decision_effect":"needs_confirmation","constraints":["Add a city/province overlay or confirm with the competent local authority."],"required_evidence":["opportunity_location"],"preparation_action_ids":["PREP-CN-LOCAL-001"],"support_item_ids":[],"source_ids":["CN-SC-FOREIGN-EMPLOYMENT","CN-NIA-GUIDE"],"effective_from":null,"effective_until":null,"last_verified_at":"2026-08-01","review_at":"2026-09-01","uncertainty_policy":"needs_confirmation","reviewer":"Policy reviewer required"}
  ]
}
