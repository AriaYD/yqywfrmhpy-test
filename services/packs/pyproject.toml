[project]
name = "campuspath-packs"
version = "0.1.0"
description = "International Student Context Pack（vendored，确定性求值，零 LLM）"
requires-python = ">=3.12"
dependencies = [
    "campuspath-contracts",
]

# 🚫 本包**永远**不得依赖任何模型 SDK（B11）。
# 求值器不推断政策、不调用模型：缺失/过期/冲突一律 needs_confirmation。

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campuspath_packs"]

[tool.uv.sources]
campuspath-contracts = { path = "../../contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
