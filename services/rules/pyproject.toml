[project]
name = "campuspath-rules"
version = "1.0.0"
description = "Rules & Constraint Engine —— 确定性服务平面，零 LLM（WP5）"
requires-python = ">=3.12"
dependencies = [
    "campuspath-contracts",
    "campuspath-packs",
]

# 🚫 本包**永远**不得依赖任何模型 SDK。
# 这不是风格偏好：Spec §8.1 与 D3 要求 Rules Engine 在构建期就不可能调用模型，
# 由 tests/test_llm_free.py 三层扫描强制（运行时 sys.modules / 依赖树 / 源码 import）。

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campuspath_rules"]

[tool.uv.sources]
campuspath-contracts = { path = "../../contracts", editable = true }
campuspath-packs = { path = "../packs", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
