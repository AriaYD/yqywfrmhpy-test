[project]
name = "campuspath-agents"
version = "1.0.0"
description = "A0–A5 Agent 层：工具白名单强制、Workflow 构件、Vertex-only 运行时守卫（WP6）"
requires-python = ">=3.12"
dependencies = [
    "campuspath-contracts",
    "campuspath-rules",
    "campuspath-capacity",
]

# 这一层**会**调用模型，因此不在零 LLM 名单里。
# 但它必须走 Vertex：campuspath_agents.vertex 在构造 Agent 前做运行时断言，
# 因为后端是由环境变量选的，源码扫描看不见。

[project.optional-dependencies]
dev = ["pytest>=8.0"]
adk = ["google-adk>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campuspath_agents"]

[tool.uv.sources]
campuspath-contracts = { path = "../contracts", editable = true }
campuspath-rules = { path = "../services/rules", editable = true }
campuspath-capacity = { path = "../services/capacity", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
