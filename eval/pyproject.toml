[project]
name = "campuspath-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "campuspath-contracts",
    "campuspath-rules",
    "campuspath-capacity",
    "campuspath-wellbeing",
    "campuspath-state",
    "campuspath-aggregation",
    "campuspath-monitor",
    "campuspath-publishing",
    "campuspath-connector",
    "campuspath-api",
    "campuspath-seed",
]

# 评测**不依赖模型 SDK**：13 条 BLOCKER 全部是结构性的，
# 用真模型跑只会让判定变慢、变贵、而且不可复现（D6.7 要两次数字一致）。
# 需要模型的 TARGET 单独标注为"未采样"，不假装测过。

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campuspath_eval"]
